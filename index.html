<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SIPENA 37</title>
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/9805/9805578.png" type="image/x-icon">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #f4fbf8;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    .container {
      width: 100%;
      height: 100vh;
      height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
    }

    .iframe-container {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #f1f5f9;
    }


    /* ========================================
       LOADING SCREEN
       PORTAL INFORMASI & PENGETAHUAN
       ======================================== */

    .loading {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle at 10% 15%,
          rgba(16, 185, 129, 0.16),
          transparent 30%
        ),
        radial-gradient(
          circle at 90% 20%,
          rgba(59, 130, 246, 0.15),
          transparent 30%
        ),
        radial-gradient(
          circle at 50% 100%,
          rgba(45, 212, 191, 0.14),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #effcf7 0%,
          #f8fbff 50%,
          #edf7ff 100%
        );

      z-index: 10;

      transition:
        opacity 0.6s ease,
        visibility 0.6s ease;
    }

    .loading.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }


    /* ========================================
       BACKGROUND DECORATION
       ======================================== */

    .background-circle {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }

    .circle-one {
      width: 260px;
      height: 260px;
      top: -120px;
      left: -100px;
      background: rgba(16, 185, 129, 0.07);
    }

    .circle-two {
      width: 320px;
      height: 320px;
      right: -150px;
      bottom: -150px;
      background: rgba(59, 130, 246, 0.07);
    }

    .circle-three {
      width: 120px;
      height: 120px;
      right: 14%;
      top: 10%;
      background: rgba(45, 212, 191, 0.06);
    }


    /* ========================================
       FLOATING DECORATIONS
       ======================================== */

    .floating-icon {
      position: absolute;

      display: flex;
      align-items: center;
      justify-content: center;

      width: 42px;
      height: 42px;

      border-radius: 14px;

      background: rgba(255, 255, 255, 0.62);
      border: 1px solid rgba(255, 255, 255, 0.85);

      box-shadow:
        0 10px 25px rgba(15, 23, 42, 0.07);

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      font-size: 20px;

      animation: floating 4s ease-in-out infinite;
    }

    .floating-one {
      top: 13%;
      left: 17%;
      animation-delay: 0s;
    }

    .floating-two {
      top: 20%;
      right: 18%;
      animation-delay: 1s;
    }

    .floating-three {
      bottom: 17%;
      left: 19%;
      animation-delay: 1.8s;
    }

    .floating-four {
      bottom: 14%;
      right: 18%;
      animation-delay: 2.6s;
    }

    @keyframes floating {

      0%,
      100% {
        transform: translateY(0) rotate(0deg);
      }

      50% {
        transform: translateY(-9px) rotate(3deg);
      }

    }


    /* ========================================
       MAIN GLASS CARD
       ======================================== */

    .loading-content {
      position: relative;
      z-index: 5;

      width: min(90%, 460px);

      padding: 38px 30px 34px;

      display: flex;
      flex-direction: column;
      align-items: center;

      text-align: center;

      background: rgba(255, 255, 255, 0.60);

      border: 1px solid rgba(255, 255, 255, 0.85);

      border-radius: 32px;

      box-shadow:
        0 30px 80px rgba(15, 23, 42, 0.10),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);

      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);

      animation: cardAppear 0.8s ease-out;
    }

    @keyframes cardAppear {

      from {
        opacity: 0;
        transform: translateY(18px) scale(0.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

    }


    /* ========================================
       KNOWLEDGE ORBIT
       ======================================== */

    .knowledge-loader {
      position: relative;

      width: 170px;
      height: 170px;

      margin-bottom: 23px;

      display: flex;
      align-items: center;
      justify-content: center;
    }


    /* Orbit luar */

    .orbit {
      position: absolute;

      width: 150px;
      height: 150px;

      border: 1.5px solid rgba(16, 185, 129, 0.20);

      border-radius: 50%;

      animation:
        rotateOrbit 8s linear infinite;
    }

    .orbit::after {
      content: "";

      position: absolute;

      width: 9px;
      height: 9px;

      top: -5px;
      left: 50%;

      transform: translateX(-50%);

      border-radius: 50%;

      background: #10b981;

      box-shadow:
        0 0 0 5px rgba(16, 185, 129, 0.10),
        0 0 18px rgba(16, 185, 129, 0.45);
    }


    /* Orbit dalam */

    .orbit-inner {
      position: absolute;

      width: 112px;
      height: 112px;

      border: 1.5px solid rgba(59, 130, 246, 0.20);

      border-radius: 50%;

      animation:
        rotateOrbitReverse 6s linear infinite;
    }

    .orbit-inner::after {
      content: "";

      position: absolute;

      width: 8px;
      height: 8px;

      right: -4px;
      top: 50%;

      transform: translateY(-50%);

      border-radius: 50%;

      background: #3b82f6;

      box-shadow:
        0 0 0 5px rgba(59, 130, 246, 0.10),
        0 0 18px rgba(59, 130, 246, 0.40);
    }

    @keyframes rotateOrbit {

      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }

    }

    @keyframes rotateOrbitReverse {

      from {
        transform: rotate(360deg);
      }

      to {
        transform: rotate(0deg);
      }

    }


    /* ========================================
       CENTRAL GLOBE
       ======================================== */

    .globe {

      position: relative;

      width: 65px;
      height: 65px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background:
        linear-gradient(
          145deg,
          #34d399,
          #14b8a6 48%,
          #3b82f6
        );

      box-shadow:
        0 15px 35px rgba(16, 185, 129, 0.24),
        inset 5px 5px 12px rgba(255, 255, 255, 0.25),
        inset -5px -5px 12px rgba(15, 23, 42, 0.12);

      animation: globePulse 3s ease-in-out infinite;
    }

    .globe::before {
      content: "";

      position: absolute;

      width: 45px;
      height: 45px;

      border: 1.5px solid rgba(255, 255, 255, 0.65);

      border-radius: 50%;
    }

    .globe::after {
      content: "";

      position: absolute;

      width: 52px;
      height: 20px;

      border-top: 1.5px solid rgba(255, 255, 255, 0.60);
      border-bottom: 1.5px solid rgba(255, 255, 255, 0.60);

      border-radius: 50%;
    }

    .globe-symbol {
      position: relative;
      z-index: 2;

      color: white;

      font-size: 27px;

      font-weight: 600;
    }

    @keyframes globePulse {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.05);
      }

    }


    /* ========================================
       KNOWLEDGE ICONS
       ======================================== */

    .knowledge-icon {
      position: absolute;

      width: 36px;
      height: 36px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 12px;

      background: rgba(255, 255, 255, 0.90);

      border: 1px solid rgba(255, 255, 255, 0.9);

      box-shadow:
        0 8px 20px rgba(15, 23, 42, 0.09);

      font-size: 17px;

      animation: iconFloat 3s ease-in-out infinite;
    }

    .icon-book {
      top: 0;
      left: 12px;
      color: #8b5cf6;
      animation-delay: 0.3s;
    }

    .icon-light {
      top: 14px;
      right: 2px;
      color: #f59e0b;
      animation-delay: 0.8s;
    }

    .icon-document {
      bottom: 6px;
      right: 15px;
      color: #3b82f6;
      animation-delay: 1.3s;
    }

    .icon-star {
      bottom: 5px;
      left: 13px;
      color: #f59e0b;
      animation-delay: 1.8s;
    }

    .icon-chart {
      top: 50%;
      left: -2px;
      color: #10b981;
      animation-delay: 2.2s;
    }

    @keyframes iconFloat {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-5px);
      }

    }


    /* ========================================
       BRAND
       ======================================== */

    .brand {

      font-size: 1.55rem;

      font-weight: 800;

      letter-spacing: 0.5px;

      background:
        linear-gradient(
          90deg,
          #059669,
          #0f766e,
          #2563eb
        );

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;

      margin-bottom: 5px;
    }


    .brand-subtitle {

      color: #64748b;

      font-size: 0.84rem;

      font-weight: 500;

      letter-spacing: 0.6px;

      margin-bottom: 25px;
    }


    /* ========================================
       LOADING TEXT
       ======================================== */

    .loading-text {

      font-size: 0.92rem;

      font-weight: 600;

      color: #334155;

      letter-spacing: 0.2px;
    }

    .loading-text::after {

      content: '';

      animation: dots 2s infinite;
    }

    @keyframes dots {

      0%,
      20% {
        content: '';
      }

      40% {
        content: '.';
      }

      60% {
        content: '..';
      }

      80%,
      100% {
        content: '...';
      }

    }


    /* ========================================
       PROGRESS BAR
       ======================================== */

    .progress-container {

      width: 190px;

      height: 4px;

      margin-top: 15px;

      overflow: hidden;

      border-radius: 20px;

      background: rgba(148, 163, 184, 0.18);
    }

    .progress-bar {

      width: 45%;

      height: 100%;

      border-radius: 20px;

      background:
        linear-gradient(
          90deg,
          #10b981,
          #14b8a6,
          #3b82f6
        );

      animation:
        loadingProgress 1.6s ease-in-out infinite;
    }

    @keyframes loadingProgress {

      0% {
        transform: translateX(-120%);
      }

      50% {
        transform: translateX(100%);
      }

      100% {
        transform: translateX(320%);
      }

    }


    /* ========================================
       MOBILE
       ======================================== */

    @media (max-width: 480px) {

      .loading-content {

        width: 88%;

        padding: 32px 22px 28px;

        border-radius: 27px;
      }

      .knowledge-loader {

        transform: scale(0.92);

        margin-bottom: 18px;
      }

      .brand {

        font-size: 1.35rem;
      }

      .brand-subtitle {

        font-size: 0.75rem;

        margin-bottom: 22px;
      }

      .loading-text {

        font-size: 0.85rem;
      }

      .floating-icon {

        width: 36px;
        height: 36px;

        font-size: 17px;
      }

    }

  </style>
</head>

<body>

  <div class="container">

    <!-- ========================================
         LOADING SCREEN
         ======================================== -->

    <div class="loading" id="loading">

      <!-- Background -->
      <div class="background-circle circle-one"></div>
      <div class="background-circle circle-two"></div>
      <div class="background-circle circle-three"></div>


      <!-- Floating Knowledge Icons -->

      <div class="floating-icon floating-one">
        📚
      </div>

      <div class="floating-icon floating-two">
        💡
      </div>

      <div class="floating-icon floating-three">
        📄
      </div>

      <div class="floating-icon floating-four">
        ⭐
      </div>


      <!-- Main Card -->

      <div class="loading-content">


        <!-- ====================================
             KNOWLEDGE ORBIT
             ==================================== -->

        <div class="knowledge-loader">

          <div class="orbit"></div>

          <div class="orbit-inner"></div>


          <!-- Knowledge Icons -->

          <div class="knowledge-icon icon-book">
            📖
          </div>

          <div class="knowledge-icon icon-light">
            💡
          </div>

          <div class="knowledge-icon icon-document">
            📄
          </div>

          <div class="knowledge-icon icon-star">
            ⭐
          </div>

          <div class="knowledge-icon icon-chart">
            📊
          </div>


          <!-- Globe -->

          <div class="globe">

            <span class="globe-symbol">
              ◉
            </span>

          </div>

        </div>


        <!-- ====================================
             BRAND
             ==================================== -->

        <div class="brand">
          Digitalisasi 37
        </div>

        <div class="brand-subtitle">
          Pusat Informasi &amp; Hasil
        </div>


        <!-- ====================================
             LOADING
             ==================================== -->

        <div class="loading-text">
          Memuat Informasi
        </div>

        <div class="progress-container">

          <div class="progress-bar"></div>

        </div>

      </div>

    </div>


    <!-- ========================================
         IFRAME APLIKASI
         TIDAK DIUBAH
         ======================================== -->

    <div class="iframe-container">

      <iframe
        id="appFrame"
        src=""
        allow="fullscreen; camera; microphone"
        sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals allow-downloads">
      </iframe>

    </div>

  </div>


  <script>

    // =============================================
    // URL GOOGLE APPS SCRIPT
    // TIDAK DIUBAH
    // =============================================

    var APP_URL = "https://script.google.com/macros/s/AKfycbzKrJFsVpgpsqiyQFAhzMO2B1aG3VWhV6dGK8OD3_TMsWP07VcsRa2MyfrS90eRQrYc-A/exec";

    var appFrame = document.getElementById('appFrame');

    var loading = document.getElementById('loading');


    // =============================================
    // HANDLER REQUEST DARI IFRAME
    // TIDAK DIUBAH
    // =============================================

    window.addEventListener('message', function(event) {

      try {

        var data = event.data;

        if (!data || typeof data !== 'object') return;


        // 1. Buka tab kosong atas nama parent

        if (data.action === 'openBlank') {

          window.open('', '_blank');

          return;
        }


        // 2. Buka URL langsung dari parent

        if (data.action === 'openDownload' && data.url) {

          window.open(data.url, '_blank');

          return;
        }


        // 3. Fullscreen dari parent document

        if (data.action === 'requestFullscreen') {

          var el = document.documentElement;

          var fn =
            el.requestFullscreen ||
            el.webkitRequestFullscreen ||
            el.msRequestFullscreen;

          if (fn) fn.call(el).catch(function(){});

          return;
        }

      } catch(e) {

        console.warn('PostMessage error:', e);

      }

    });


    // =============================================
    // LOGIKA DELAY 6 DETIK
    // TIDAK DIUBAH
    // =============================================

    var startTime = Date.now();

    var MIN_LOAD_TIME = 6000;


    function loadApp() {

      var fullUrl = window.location.href;

      var params =
        new URLSearchParams(window.location.search);

      var id = params.get('id');

      var targetUrl = APP_URL;


      if (id) {

        if (targetUrl.indexOf('?') !== -1) {

          targetUrl += "&id=" + id;

        } else {

          targetUrl += "?id=" + id;

        }

      }


      appFrame.src = targetUrl;

    }


    function hideLoading() {

      loading.classList.add('hidden');

    }


    appFrame.addEventListener('load', function() {

      var elapsedTime =
        Date.now() - startTime;

      var remainingTime =
        MIN_LOAD_TIME - elapsedTime;


      if (remainingTime > 0) {

        setTimeout(
          hideLoading,
          remainingTime
        );

      } else {

        hideLoading();

      }

    });


    window.addEventListener(
      'DOMContentLoaded',
      loadApp
    );

  </script>

</body>
</html>
